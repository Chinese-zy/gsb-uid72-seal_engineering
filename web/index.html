<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>封样台</title>
  <style>
    body { margin: 0; background: #f4f1ea; color: #1c1917; font: 16px/1.5 "Songti SC", serif; }
    main { max-width: 640px; margin: 0 auto; padding: 28px 20px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    form { display: flex; gap: 8px; margin: 12px 0 20px; }
    input, button { font: inherit; padding: 6px 8px; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <main>
    <h1>封样台</h1>
    <p>已经落库的封样。</p>
    <form id="add">
      <input name="code" placeholder="编号" required>
      <input name="grams" type="number" placeholder="克" required>
      <button type="submit">记下</button>
    </form>
    <ul id="list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
